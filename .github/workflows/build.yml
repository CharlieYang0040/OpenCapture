name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset vs2022-core-tests
      - name: Build
        run: cmake --build --preset vs2022-core-tests
      - name: Test
        run: ctest --preset vs2022-core-tests
